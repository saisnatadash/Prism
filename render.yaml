# Render Blueprint — deploys the FastAPI backend + a managed Postgres DB.
# Usage: push this repo to GitHub, then in Render: New > Blueprint, point it
# at the repo. Render reads this file and provisions everything below.
databases:
  - name: prism-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: prism-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prism-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"   # tighten to your Cloudflare Pages URL after first deploy
      - key: AUTO_SEED
        value: "true"
